      - "SCR-S003"
    systems_or_channels:
      - "POS"
    purpose: "센터 현장에서 직원이 직접 상품을 선택하고 구매자를 지정해 결제 등록 화면으로 넘기는 현장 판매(POS) 화면입니다. 카운터에서 회원이 방문했을 때 회원권·수강권(PT/GX/골프)·락커·운동복·일반 상품을 빠르게 장바구니에 담고, 현금가·카드가를 선택한 뒤 결제 처리 화면(SCR-S003)으로 이동합니다. 이 화면은 회원/상품 선택과 장바구니 구성을 담당하며, 실제 결제는 인포데스크(FC)가 외부 POS 또는 현금 수납으로 완료한 뒤 SCR-S003에서 영수증 파일을 첨부해 등록합니다. 비대면 고"
    context: "SCR-S002 POS 판매"
    source: "D03-매출관리/매출관리.md:127"
